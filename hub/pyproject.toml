[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-switchboard-hub"
version = "0.3.0"
description = "Aggregating MCP gateway for outbound tunnels, with a web console, call log, and Prometheus/Loki export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akos Papp" }]
keywords = ["mcp", "model-context-protocol", "gateway", "reverse-proxy", "n8n"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.2,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "prometheus-client>=0.20",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/AkosPapp/mcp-switchboard"
Repository = "https://github.com/AkosPapp/mcp-switchboard"

[project.scripts]
mcp-switchboard-hub = "mcp_switchboard_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_switchboard_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

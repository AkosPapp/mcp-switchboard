name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: client (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The client depends on the harness, which is not on PyPI (pip ignores the
      # uv workspace source), so install it from its local path in the same command.
      - run: pip install -e ./servers/harness -e "./client[test]"
      - run: pytest client/tests -q

  hub:
    name: hub (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The MCP SDK requires >=3.10.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "./legacy/hub[test]"
      - run: pytest legacy/hub/tests -q

  harness:
    name: harness (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "./servers/harness[test]"
      - run: pytest servers/harness/tests -q

  end-to-end:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: hub/go.sum
      - run: pip install -e ./servers/harness -e "./client[test]"
      # The hub under test is the shipped artifact: the same CGO-free binary the
      # container and the Nix package build, not an in-process import of it.
      - name: build the hub
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/mcp-switchboard-hub" ./cmd/mcp-switchboard-hub
        working-directory: hub
      # Runs a real client process tunnelling a real MCP server to a real hub,
      # then calls a tool both through the console API and as an MCP consumer.
      - run: pytest tests -q
        env:
          MCP_SWITCHBOARD_HUB_BINARY: ${{ runner.temp }}/mcp-switchboard-hub

  hub-go:
    name: hub (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: hub/go.sum
      # -race needs cgo, which is why this job does not set CGO_ENABLED=0. The
      # shipped binary still builds without cgo; the build step below proves it.
      - run: go vet ./...
      - run: go test ./... -race
      - name: build the way we ship it
        run: CGO_ENABLED=0 go build ./cmd/...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  console:
    name: console (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # dist/ is committed because `go build` has to work without npm, so it can
      # go stale. The Vite build is byte-reproducible for a given lockfile and
      # node version, which is what makes rebuilding and diffing a reliable
      # check rather than a flaky one (spec.md U1).
      - name: dist/ is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "hub/web/dist is stale. Run 'npm run build' in hub/web and commit the result." >&2
            git diff --stat -- dist >&2
            exit 1
          fi

  console-e2e:
    name: console (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: hub/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The suite drives the shipped binary with a real client behind it, so it
      # needs all three toolchains. The console comes from dist/, which is
      # committed, so no npm build step is required to produce the binary.
      - run: pip install -e ./servers/harness -e ./client
      - name: build the hub
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/mcp-switchboard-hub" ./cmd/mcp-switchboard-hub
        working-directory: hub
      - run: npm ci
        working-directory: hub/web
      - run: npx playwright install --with-deps chromium
        working-directory: hub/web
      - run: npm run test:e2e
        working-directory: hub/web
        env:
          MCP_SWITCHBOARD_HUB_BINARY: ${{ runner.temp }}/mcp-switchboard-hub
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: hub/web/test-results/
          retention-days: 7

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: "install.sh"

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # --no-build only evaluates, so it would not have noticed a check that
      # builds but fails - which is exactly how the package-shape check went
      # stale unseen. Evaluate everything, then build what does not need KVM.
      - run: nix flake check --no-build
      - run: nix build .#hub .#client .#harness -L
      # The VM test needs KVM, so it is excluded here and run on a schedule or
      # by hand; package-shape is cheap and asserts the invariants that matter.
      - run: nix build .#checks.x86_64-linux.package-shape -L

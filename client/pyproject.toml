[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-switchboard-client"
version = "0.2.0"
description = "Tunnels local stdio MCP servers to an mcp-switchboard hub over one outbound WebSocket"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akos Papp" }]
keywords = ["mcp", "model-context-protocol", "tunnel", "reverse-proxy", "switchboard"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# The client itself speaks no MCP (it is a dumb pipe). The `mcp` SDK arrives only
# via the built-in coding harness server, which the client spawns by default.
dependencies = [
    "mcp-switchboard-server-harness",
    "websockets>=14",
    # A bundled CA bundle for the TLS handshake, not just for convenience: this
    # client is typically run via `uvx` with astral's portable CPython builds,
    # which often can't find a usable system cert store (NixOS's is at a
    # nonstandard path), causing every wss:// connection to fail with
    # CERTIFICATE_VERIFY_FAILED regardless of the host actually being fine.
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio>=0.23"]

[tool.uv.sources]
mcp-switchboard-server-harness = { workspace = true }

[project.urls]
Homepage = "https://github.com/AkosPapp/mcp-switchboard"
Repository = "https://github.com/AkosPapp/mcp-switchboard"

[project.scripts]
mcp-switchboard-client = "mcp_switchboard_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_switchboard_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-reverse-proxy-client"
version = "0.1.0"
description = "Outbound-only reverse proxy that tunnels local MCP stdio servers to an MCP gateway (Context Forge)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Akos Papp" }]
keywords = ["mcp", "model-context-protocol", "reverse-proxy", "context-forge", "mcp-gateway"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/AkosPapp/agent-reverse-proxy"
Repository = "https://github.com/AkosPapp/agent-reverse-proxy"

[project.scripts]
mcp-reverse-proxy-client = "mcp_reverse_proxy_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_reverse_proxy_client"]
